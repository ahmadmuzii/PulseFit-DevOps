version: 0.0
os: linux

files:
  - source: /
    destination: /home/ubuntu/demo-app

permissions:
  - object: /home/ubuntu/demo-app
    owner: ubuntu
    group: ubuntu
    mode: "755"
    type:
      - directory
      - file

hooks:
  ApplicationStop:
    - location: scripts/stop.sh
      timeout: 30
      runas: ubuntu

  AfterInstall:
    - location: scripts/install.sh
      timeout: 120
      runas: ubuntu

  ApplicationStart:
    - location: scripts/start.sh
      timeout: 30
      runas: ubuntu